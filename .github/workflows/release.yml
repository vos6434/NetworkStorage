# Build the plugin jar and publish a GitHub Release. Tag push (v*) or manual run.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      skip_modrinth:
        description: Skip Modrinth upload
        required: false
        default: true
        type: boolean
      skip_hangar:
        description: Skip Hangar upload
        required: false
        default: true
        type: boolean
      hangar_channel:
        description: Hangar channel name (when Hangar upload is enabled)
        required: false
        default: Release
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Read version from pom.xml
        id: meta
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout --no-transfer-progress -f NetworkStorage/pom.xml)
          ARTIFACT_ID=$(mvn help:evaluate -Dexpression=project.artifactId -q -DforceStdout --no-transfer-progress -f NetworkStorage/pom.xml)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "artifact_id=$ARTIFACT_ID" >> "$GITHUB_OUTPUT"
          echo "jar_file=NetworkStorage/target/${ARTIFACT_ID}-${VERSION}.jar" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches pom version
        if: github.event_name == 'push'
        run: |
          POM_VER="${{ steps.meta.outputs.version }}"
          TAG="${{ github.ref_name }}"
          TAG_VER="${TAG#v}"
          if [ "$POM_VER" != "$TAG_VER" ]; then
            echo "::error::pom.xml version is $POM_VER but tag is $TAG (expected v$POM_VER)"
            exit 1
          fi

      - name: Set release tag
        id: rel
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${{ steps.meta.outputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build with Maven
        run: mvn -B package --file NetworkStorage/pom.xml

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          files: ${{ steps.meta.outputs.jar_file }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Modrinth
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.skip_modrinth != 'true'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: MFLw2RTS
          modrinth-token: ${{ secrets.MODRINTH_API_TOKEN }}
          version: ${{ steps.meta.outputs.version }}
          version-type: release
          loaders: |
            paper
          game-versions: |
            >=1.21 <=26.1.2
          files: ${{ steps.meta.outputs.jar_file }}

      - name: Upload to Hangar
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.skip_hangar != 'true'
        uses: milkdrinkers/Hangar-Publish@v2
        with:
          api_token: ${{ secrets.HANGAR_API_TOKEN }}
          slug: NetworkStorage
          version: ${{ steps.meta.outputs.version }}
          channel: ${{ github.event.inputs.hangar_channel }}
          files: |
            [
              {
                "path": "${{ steps.meta.outputs.jar_file }}",
                "platforms": ["PAPER"]
              }
            ]
          platform_dependencies: |
            {
              "PAPER": [">=1.21 <=26.1.2"]
            }
