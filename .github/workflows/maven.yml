# Build the Paper plugin on pushes and PRs to main.

name: Java CI with Maven

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Paper API for this pom is newer bytecode than JDK 21 can compile against; bytecode target stays 21 in pom.xml.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      - name: Build with Maven
        run: mvn -B package --file NetworkStorage/pom.xml
